<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Interactive chart of the effective parameter multiplier of a looped block against loop count, for four values of the recurrence-equivalence exponent phi: 1.0, 0.65, 0.46 as measured, and 0.38 under truncated backpropagation. Click a value of phi and drag across the chart to read off, for each loop count, how many fresh blocks a recurrence is worth and how many times the FLOPs it costs.">
<style>.ov{cursor:grab}.ov:active{cursor:grabbing}.btn{cursor:pointer}.btn rect{transition:fill .12s,stroke .12s}.nop{pointer-events:none}</style>
<rect width="760" height="470" fill="#ffffff"/>
<text x="24" y="28" font-size="13" fill="#1b1b1a" font-weight="700">What is one recurrence worth?</text>
<text x="24" y="46" font-size="11" fill="#6b6b66">Effective parameter multiplier on the looped block. Pick &#966;, then drag across the chart.</text>
<line x1="92" y1="330.0" x2="596" y2="330.0" stroke="#ececec" stroke-width="1"/>
<text x="82" y="334.0" font-size="11.5" fill="#6b6b66" text-anchor="end">1&#215;</text>
