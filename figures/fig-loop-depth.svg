<text x="24" y="438" font-size="10.5" fill="#6b6b66">Ouro: Zhu et al. 2025, Tables 10 and 12&#8211;13. Huginn: Geiping et al. 2025, Table 1, one checkpoint throughout.</text>
<rect id="ov" class="ov" x="62" y="86" width="310" height="244" fill="#ffffff" fill-opacity="0" style="touch-action:pan-y"/>
<script><![CDATA[
(function(){var svg=document.documentElement;
function toX(e){var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse()).x;}
var X0=78,PPT=39.714285714285715,YB=310,YT=100;
var D=[[0.0, 37.33, 62.33, 65.0, 60.67, 50.67, 42.33, 38.67], [18.96, 68.59, 75.56, 76.44, 71.85, 69.19, 57.63, 39.26], [41.21, 60.43, 66.71, 67.45, 66.64, 65.77, 65.28, 64.49]];var NM=['AIME 2024 (1.4B-Thinking)','OlympiadBench (2.6B-Thinking)','MMLU (1.4B base)'];
var PK=D.map(function(a){return Math.max.apply(null,a);});
function sy(v){return YB-v*(YB-YT)/80;}function px(t){return X0+(t-1)*PPT;}
var cur=document.getElementById('cur');var ro=[0,1,2,3].map(function(i){return document.getElementById('ro'+i);});
function upd(t){t=Math.max(1,Math.min(8,Math.round(t)));var x=px(t);cur.setAttribute('x1',x);cur.setAttribute('x2',x);
for(var i=0;i<3;i++){var v=D[i][t-1],m=document.getElementById('m'+i),l=document.getElementById('v'+i);m.setAttribute('cx',x);m.setAttribute('cy',sy(v));
l.setAttribute('x',x+(t>=6?-9:9));l.setAttribute('text-anchor',t>=6?'end':'start');l.setAttribute('y',sy(v)+(i===0?14:i===1?-8:-8));l.textContent=v.toFixed(1);}
ro[0].textContent='T = '+t+(t>4?' \u2014 past the trained depth':t===4?' \u2014 the trained depth':'');
for(var i=0;i<3;i++){var v=D[i][t-1],d=v-PK[i];ro[i+1].textContent=NM[i]+': '+v.toFixed(1)+(d<-0.05?' ('+d.toFixed(1)+' from peak)':' (peak)');}}
var drag=false;var ov=document.getElementById('ov');
ov.addEventListener('pointerdown',function(e){drag=true;ov.setPointerCapture(e.pointerId);upd((toX(e)-X0)/PPT);});
ov.addEventListener('pointermove',function(e){if(drag||e.pointerType==='mouse')upd((toX(e)-X0)/PPT);});
addEventListener('pointerup',function(){drag=false;});
upd(4);})();
]]></script>
</svg>
