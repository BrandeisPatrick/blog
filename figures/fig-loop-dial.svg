<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Interactive diagram: a looped transformer stores two blocks of weights and applies them r times. Drag the slider from 1 to 8 loops: the column of block applications grows, the bar for stored parameters stays fixed, and the bar for compute per token grows in proportion to r.">
<style>.ov{cursor:grab}.ov:active{cursor:grabbing}.nop{pointer-events:none}</style>
<rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b5482e"/></marker></defs>
<text x="24" y="28" font-size="13" fill="#1b1b1a" font-weight="700">Same weights, again</text>
<text x="24" y="46" font-size="11" fill="#6b6b66">A looped transformer stores a block once and runs it r times. Drag to change r.</text>
<text x="60" y="78" font-size="12" fill="#1b1b1a" font-weight="600">stored</text>
<rect x="60" y="90" width="120" height="30" rx="6" fill="#fbeeea" stroke="#b5482e"/>
