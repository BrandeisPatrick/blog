<rect id="ub4" x="300" y="148.0" width="120" height="12" rx="3" fill="#fbeeea" stroke="#b5482e"/>
<rect id="ub5" x="300" y="163.5" width="120" height="12" rx="3" fill="#eaf6f0" stroke="#178a5c"/>
<rect id="ub6" x="300" y="179.0" width="120" height="12" rx="3" fill="#fbeeea" stroke="#b5482e"/>
<rect id="ub7" x="300" y="194.5" width="120" height="12" rx="3" fill="#eaf6f0" stroke="#178a5c"/>
<rect id="ub8" x="300" y="210.0" width="120" height="12" rx="3" fill="#fbeeea" stroke="#b5482e"/>
<rect id="ub9" x="300" y="225.5" width="120" height="12" rx="3" fill="#eaf6f0" stroke="#178a5c"/>
<rect id="ub10" x="300" y="241.0" width="120" height="12" rx="3" fill="#fbeeea" stroke="#b5482e"/>
<rect id="ub11" x="300" y="256.5" width="120" height="12" rx="3" fill="#eaf6f0" stroke="#178a5c"/>
<rect id="ub12" x="300" y="272.0" width="120" height="12" rx="3" fill="#fbeeea" stroke="#b5482e"/>
<rect id="ub13" x="300" y="287.5" width="120" height="12" rx="3" fill="#eaf6f0" stroke="#178a5c"/>
<rect id="ub14" x="300" y="303.0" width="120" height="12" rx="3" fill="#fbeeea" stroke="#b5482e"/>
<rect id="ub15" x="300" y="318.5" width="120" height="12" rx="3" fill="#eaf6f0" stroke="#178a5c"/>
<text x="470" y="78" font-size="12" fill="#1b1b1a" font-weight="600">parameters stored</text>
<rect x="470" y="88" width="240" height="12" rx="3" fill="none" stroke="#ececec"/>
<rect x="470" y="88" width="30" height="12" rx="3" fill="#c9c9c4" stroke="none"/>
<text x="470" y="116" font-size="10.5" fill="#6b6b66">the same 2 blocks, whatever r is</text>
<text x="470" y="142" font-size="12" fill="#1b1b1a" font-weight="600">compute per token</text>
<rect x="470" y="152" width="240" height="12" rx="3" fill="none" stroke="#ececec"/>
<rect id="cb" x="470" y="152" width="30" height="12" rx="3" fill="#b5482e" stroke="none"/>
<text id="cl" x="470" y="180" font-size="10.5" fill="#b5482e" font-weight="700"></text>
<text x="470" y="210" font-size="12" fill="#1b1b1a" font-weight="600">effective depth</text>
<text id="dl" x="470" y="230" font-size="12.5" fill="#1b1b1a" font-weight="700"></text>
<text x="470" y="262" font-size="11" fill="#6b6b66">A loop trades parameters for compute:</text>
<text x="470" y="278" font-size="11" fill="#6b6b66">depth grows, the weight file does not.</text>
<rect x="120" y="316" width="520" height="8" rx="4" fill="#f6f6f4" stroke="#ececec"/>
<rect id="fb" x="120" y="316" width="0" height="8" rx="4" fill="#b5482e" stroke="none" opacity="0.28"/>
<line x1="120" y1="332" x2="640" y2="332" stroke="#ececec" stroke-width="1.5"/>
<line x1="120.0" y1="332" x2="120.0" y2="338" stroke="#ececec" stroke-width="1"/>
<text x="120.0" y="351" font-size="11" fill="#6b6b66" text-anchor="middle">1</text>
<line x1="194.28571428571428" y1="332" x2="194.28571428571428" y2="338" stroke="#ececec" stroke-width="1"/>
<text x="194.28571428571428" y="351" font-size="11" fill="#6b6b66" text-anchor="middle">2</text>
