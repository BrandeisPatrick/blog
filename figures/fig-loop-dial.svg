<text x="120" y="148" font-size="12" fill="#1b1b1a" text-anchor="middle">block 2</text>
<path d="M 190 158 L 206 158 L 206 90 L 190 90" fill="none" stroke="#b5482e" stroke-width="1.5" marker-end="url(#ara)"/>
<text id="rl" x="211" y="128" font-size="12" fill="#b5482e" font-weight="700">&#215;r</text>
<text x="120" y="182" font-size="10.5" fill="#6b6b66" text-anchor="middle">2 blocks &#8212; never changes</text>
<text x="300" y="78" font-size="12" fill="#1b1b1a" font-weight="600">what actually runs</text>
<rect id="ub0" x="300" y="86.0" width="120" height="12" rx="3" fill="#fbeeea" stroke="#b5482e"/>
<rect id="ub1" x="300" y="101.5" width="120" height="12" rx="3" fill="#eaf6f0" stroke="#178a5c"/>
