<text x="268.57142857142856" y="351" font-size="11" fill="#6b6b66" text-anchor="middle">3</text>
<line x1="342.8571428571429" y1="332" x2="342.8571428571429" y2="338" stroke="#ececec" stroke-width="1"/>
<text x="342.8571428571429" y="351" font-size="11" fill="#6b6b66" text-anchor="middle">4</text>
<line x1="417.14285714285717" y1="332" x2="417.14285714285717" y2="338" stroke="#ececec" stroke-width="1"/>
<text x="417.14285714285717" y="351" font-size="11" fill="#6b6b66" text-anchor="middle">5</text>
<line x1="491.42857142857144" y1="332" x2="491.42857142857144" y2="338" stroke="#ececec" stroke-width="1"/>
<text x="491.42857142857144" y="351" font-size="11" fill="#6b6b66" text-anchor="middle">6</text>
<line x1="565.7142857142858" y1="332" x2="565.7142857142858" y2="338" stroke="#ececec" stroke-width="1"/>
<text x="565.7142857142858" y="351" font-size="11" fill="#6b6b66" text-anchor="middle">7</text>
<line x1="640.0" y1="332" x2="640.0" y2="338" stroke="#ececec" stroke-width="1"/>
<text x="640.0" y="351" font-size="11" fill="#6b6b66" text-anchor="middle">8</text>
<g id="kg" class="nop" transform="translate(120,320)"><circle r="9" fill="#ffffff" stroke="#b5482e" stroke-width="2.2"/><circle r="3.2" fill="#b5482e"/></g>
<text x="380" y="366" font-size="11.5" fill="#6b6b66" text-anchor="middle">loops (r) &#8212; drag</text>
<text id="ro" x="380" y="390" font-size="13" fill="#1b1b1a" text-anchor="middle" font-weight="600"></text>
<rect id="ov" class="ov" x="80" y="294" width="600" height="60" fill="#ffffff" fill-opacity="0" style="touch-action:pan-y"/>
<script><![CDATA[
(function(){var svg=document.documentElement;
function toX(e){var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse()).x;}
var X0=120,PPT=74.28571428571429;
var ub=[];for(var i=0;i<16;i++)ub.push(document.getElementById('ub'+i));
var kg=document.getElementById('kg'),fb=document.getElementById('fb'),ro=document.getElementById('ro'),rl=document.getElementById('rl'),cb=document.getElementById('cb'),cl=document.getElementById('cl'),dl=document.getElementById('dl');
function upd(r){r=Math.max(1,Math.min(8,Math.round(r)));
for(var i=0;i<16;i++)ub[i].setAttribute('display',i<2*r?'':'none');
kg.setAttribute('transform','translate('+(X0+PPT*(r-1))+',320)');fb.setAttribute('width',PPT*(r-1));
rl.textContent='\u00d7'+r;cb.setAttribute('width',30*r);cl.textContent=r+'\u00d7 the stored model';
dl.textContent=(2*r)+' block applications';
ro.textContent='r = '+r+' \u2014 2 blocks stored \u00b7 '+(2*r)+' applications \u00b7 '+r+'\u00d7 the compute';}
var drag=false;var ov=document.getElementById('ov');
ov.addEventListener('pointerdown',function(e){drag=true;ov.setPointerCapture(e.pointerId);upd((toX(e)-X0)/PPT);});
ov.addEventListener('pointermove',function(e){if(drag||e.pointerType==='mouse')upd((toX(e)-X0)/PPT);});
addEventListener('pointerup',function(){drag=false;});
upd(3);})();
]]></script>
</svg>
